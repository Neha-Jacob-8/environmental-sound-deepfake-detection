<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="770" viewBox="0 0 1920 770" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1920" height="770" fill="#ffffff"/>

  <text x="960" y="62" text-anchor="middle" font-size="36" font-weight="bold" fill="#0f172a">System Block Diagram</text>

  <g>
    <rect x="60" y="120" width="312" height="170" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="216" y="195" text-anchor="middle" font-size="27" font-weight="bold" fill="#1e3a8a">Environmental</text>
    <text x="216" y="232" text-anchor="middle" font-size="27" font-weight="bold" fill="#1e3a8a">Audio</text>

    <rect x="432" y="120" width="312" height="170" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
    <text x="588" y="190" text-anchor="middle" font-size="27" font-weight="bold" fill="#0e7490">Preprocessing</text>
    <text x="588" y="232" text-anchor="middle" font-size="22" fill="#334155">16 kHz · mono · 4 s</text>

    <rect x="804" y="120" width="312" height="170" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="3"/>
    <text x="960" y="190" text-anchor="middle" font-size="27" font-weight="bold" fill="#0f766e">Feature</text>
    <text x="960" y="227" text-anchor="middle" font-size="27" font-weight="bold" fill="#0f766e">Extraction</text>

    <rect x="1176" y="120" width="312" height="170" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="3"/>
    <text x="1332" y="190" text-anchor="middle" font-size="27" font-weight="bold" fill="#6d28d9">Deepfake</text>
    <text x="1332" y="227" text-anchor="middle" font-size="27" font-weight="bold" fill="#6d28d9">Detector</text>

    <rect x="1548" y="120" width="312" height="170" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
    <text x="1704" y="212" text-anchor="middle" font-size="30" font-weight="bold" fill="#047857">Real / Fake</text>
  </g>

  <line x1="378" y1="205" x2="426" y2="205" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
  <line x1="750" y1="205" x2="798" y2="205" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
  <line x1="1122" y1="205" x2="1170" y2="205" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
  <line x1="1494" y1="205" x2="1542" y2="205" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>

  <line x1="960" y1="290" x2="960" y2="342" stroke="#94a3b8" stroke-width="3"/>
  <rect x="805" y="342" width="310" height="152" rx="10" fill="#ffffff" stroke="#5eead4" stroke-width="2.5"/>
  <text x="960" y="376" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f766e">Representation</text>
  <text x="960" y="411" text-anchor="middle" font-size="21" fill="#334155">log-Mel spectrogram</text>
  <text x="960" y="443" text-anchor="middle" font-size="21" fill="#334155">raw waveform</text>
  <text x="960" y="475" text-anchor="middle" font-size="21" fill="#334155">BEATs embedding</text>

  <line x1="1332" y1="290" x2="1332" y2="342" stroke="#94a3b8" stroke-width="3"/>
  <rect x="1142" y="342" width="380" height="152" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="2.5"/>
  <text x="1332" y="376" text-anchor="middle" font-size="21" font-weight="bold" fill="#6d28d9">Models compared</text>
  <text x="1332" y="411" text-anchor="middle" font-size="21" fill="#334155">CNN</text>
  <text x="1332" y="443" text-anchor="middle" font-size="21" fill="#334155">AASIST</text>
  <text x="1332" y="475" text-anchor="middle" font-size="21" fill="#334155">BEATs + AASIST</text>

  <rect x="60" y="560" width="1800" height="130" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="120" y="612" font-size="24" font-weight="bold" fill="#1e40af">Train:</text>
  <text x="240" y="612" font-size="24" fill="#334155">G01 · G02 · G03 · G04</text>
  <text x="120" y="658" font-size="24" font-weight="bold" fill="#b91c1c">Test:</text>
  <text x="240" y="658" font-size="24" fill="#334155">G05 · G06 · G07   (unseen generators)</text>
  <text x="1800" y="612" text-anchor="end" font-size="24" font-weight="bold" fill="#0f172a">Metric: EER ↓</text>
  <text x="1800" y="658" text-anchor="end" font-size="21" fill="#475569">reported per generator</text>
</svg>
